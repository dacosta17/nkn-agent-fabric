name: NKN Live Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/integration/**'
      - 'src/lib/**'
      - 'package.json'
      - '.github/workflows/nkn-integration.yml'

jobs:
  live-nkn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Live NKN adversarial integration
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          NKN_INTEGRATION_ROUNDS: 5
          NKN_RTT_SAMPLES: 20
          NKN_RESPONSE_TIMEOUT_MS: 7000
        run: npm run integration:nkn | tee nkn-integration-report.log

      - name: Publish integration report
        if: always()
        run: |
          echo '## NKN integration report'
          cat nkn-integration-report.log || true
